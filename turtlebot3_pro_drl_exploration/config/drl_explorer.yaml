drl_explorer:
  ros__parameters:
    map_topic: /map
    map_frame: map
    robot_frame: base_link

    planning_period_sec: 2.0
    goal_timeout_sec: 45.0
    goal_tolerance_xy: 0.35
    min_goal_distance: 0.25

    free_threshold: 20
    occupied_threshold: 65

    # drl | utility
    planner_mode: drl
    deterministic_policy: true

    # Receding-horizon lookahead (MPC-style: predict multi-step, execute one)
    use_lookahead: true
    lookahead_horizon: 3
    lookahead_top_k: 6
    lookahead_discount: 0.9

    utility_weight: 1.0
    distance_weight: 0.8
    heading_weight: 0.25
    revisit_penalty: 0.75
    policy_weight: 0.25

    device: cpu
    checkpoint_path: ""
